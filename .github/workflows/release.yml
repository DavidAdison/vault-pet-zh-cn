name: Release Chinese localization
on:
  push:
    tags: ['v*-zh-CN.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify localization tag matches upstream manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          case "$GITHUB_REF_NAME" in
            "v${version}-zh-CN."*) ;;
            *) echo "Tag does not match manifest version $version" >&2; exit 1 ;;
          esac
      - run: node scripts/build.js
      - run: node tests/run.js
      - run: node scripts/package.js
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Vault Pet 汉化版 $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE.zh-CN.md \
            dist/vault-pet-zh-cn.zip dist/main.js dist/manifest.json dist/styles.css dist/SHA256SUMS.txt
